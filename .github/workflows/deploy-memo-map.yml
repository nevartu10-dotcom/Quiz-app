name: Deploy Memo Map and Area Painter to GitHub Pages

on:
  push:
    branches: [claude/ui-concepts-feedback-app-CnZwS]
    paths:
      - 'memo-map/**'
      - 'area-painter/**'
      - '.github/workflows/deploy-memo-map.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            memo-map/package-lock.json
            area-painter/package-lock.json
      - name: Build Memo Map
        working-directory: memo-map
        run: |
          npm ci
          npm run lint
          # Relative base so the app works under https://<user>.github.io/<repo>/
          npx vite build --base=./
      - name: Build Area Painter
        working-directory: area-painter
        run: |
          npm ci
          npm run lint
          npm test
          npx vite build --base=./
      # Memo Map at the site root, Area Painter at /area-painter/
      - run: cp -r area-painter/dist memo-map/dist/area-painter
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: memo-map/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
