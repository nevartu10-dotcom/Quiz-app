name: Deploy Memo Map to GitHub Pages

on:
  push:
    branches: [claude/ui-concepts-feedback-app-CnZwS]
    paths:
      - 'memo-map/**'
      - '.github/workflows/deploy-memo-map.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memo-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memo-map/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Relative base so the app works under https://<user>.github.io/<repo>/
      - run: npx vite build --base=./
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: memo-map/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
